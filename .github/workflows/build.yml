name: Build GDInput

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows Geode mod
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with Geode
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Win64

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDInput-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
